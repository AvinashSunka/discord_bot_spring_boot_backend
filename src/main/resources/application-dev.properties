# Local development configuration.
# Use this profile for running the backend on your machine with the local wrapper and local DB.

spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}

# Local H2 database for quick development and testing.
spring.datasource.url=${DB_URL:jdbc:h2:mem:sensei-bot;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Local service endpoints.
daily.challenge.wrapper-url=${LEETCODE_WRAPPER_BASE_URL:http://localhost:3000}/api/daily
daily.challenge.discord.bot-url=${DISCORD_BOT_URL:http://localhost:3001}
daily.challenge.discord.channel-id=${DISCORD_CHANNEL_ID:}
