spring.application.name=${APP_NAME:bot}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Temporary DB shutdown while the project is running without a live database.
# The legacy repository code remains in place as dead code for future reactivation.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# Common defaults used across all environments.
# Environment-specific values live in application-dev.properties and application-prod.properties.
