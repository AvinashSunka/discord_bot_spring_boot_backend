spring.application.name=${APP_NAME:bot}
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

# Database configuration for persisted reminder and daily challenge state.
spring.datasource.url=${DB_URL:jdbc:h2:mem:sensei-bot;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Temporary local database for dev; switch to MySQL/Postgres in production.
# Example MySQL values:
# spring.datasource.url=jdbc:mysql://localhost:3306/sensei_bot
# spring.datasource.username=root
# spring.datasource.password=your-password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Daily LeetCode challenge config
# Configure these in your deployment environment or .env/secret store.
daily.challenge.wrapper-url=${LEETCODE_WRAPPER_URL}
daily.challenge.discord.bot-url=${DISCORD_BOT_URL:}
daily.challenge.discord.channel-id=${DISCORD_CHANNEL_ID:}
