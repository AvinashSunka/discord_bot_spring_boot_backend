<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Problem Set</title>
    <!-- Using Tailwind CSS for quick, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">

    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Problem Set</h1>
            <span id="problem-count" class="text-sm text-gray-500 font-medium">Loading...</span>
        </div>

        <div class="overflow-x-auto h-[800px] overflow-y-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50 sticky top-0">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Difficulty</th>
                    </tr>
                </thead>
                <tbody id="problem-table-body" class="bg-white divide-y divide-gray-200">
                    <!-- JavaScript will populate rows here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // The GraphQL API returns difficulty as a string ("Easy", "Medium", "Hard") instead of a number
const getDifficultyBadge = (levelString) => {
    switch(levelString) {
        case 'Easy': return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Easy</span>';
        case 'Medium': return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">Medium</span>';
        case 'Hard': return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Hard</span>';
        default: return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">Unknown</span>';
    }
};

// Fetch from your new topic endpoint (e.g., 'array', 'dynamic-programming', 'sliding-window')
fetch('/api/leetcode/topics/array')
    .then(response => response.json())
    .then(jsonResponse => {
        // Navigate through the new GraphQL JSON structure
        const problems = jsonResponse.data.problemsetQuestionList.questions;
        const tableBody = document.getElementById('problem-table-body');
        
        document.getElementById('problem-count').textContent = `${problems.length} problems found`;

        let rowsHtml = '';
        
        // Iterate through the problems (GraphQL limit is already set to 50 in your Java code)
        problems.forEach(p => {
            // The property names are different in the GraphQL response
            const id = p.frontendQuestionId;
            const title = p.title;
            const slug = p.titleSlug;
            const difficulty = p.difficulty; 
            const leetcodeUrl = `https://leetcode.com/problems/${slug}/`;

            rowsHtml += `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-blue-600 hover:text-blue-800">
                        <a href="${leetcodeUrl}" target="_blank">${title}</a>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">${getDifficultyBadge(difficulty)}</td>
                </tr>
            `;
        });

        tableBody.innerHTML = rowsHtml;
    })
    .catch(error => {
        console.error('Error fetching problems:', error);
        document.getElementById('problem-table-body').innerHTML = `
            <tr><td colspan="3" class="px-6 py-4 text-center text-red-500">Failed to load problems. Check console for details.</td></tr>
        `;
    });
    </script>
</body>
</html>
