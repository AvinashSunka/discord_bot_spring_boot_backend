# Production configuration.
# Use this profile on Render or another deployment target.
# Keep secrets and external URLs in environment variables instead of committed code.
# The database is intentionally disabled right now; the old JPA code remains in place as dead code.

spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

# Hard-stop JDBC/JPA/session startup so Render does not try to connect to an invalid DB host.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.session.jdbc.JdbcSessionAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
spring.session.store-type=none
spring.session.jdbc.initialize-schema=never

# In-memory fallback only; this is intentionally not a live database.
spring.datasource.url=jdbc:h2:mem:sensei-bot;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production wrapper and Discord bot endpoints.
daily.challenge.wrapper-url=${LEETCODE_WRAPPER_BASE_URL:https://leetcode-wrapper.onrender.com}/api/daily
daily.challenge.discord.bot-url=${DISCORD_BOT_URL:}
daily.challenge.discord.channel-id=${DISCORD_CHANNEL_ID:}
